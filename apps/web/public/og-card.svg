<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background Base with Grid -->
  <rect width="1200" height="630" fill="#FFFDF8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left Brutalist Accent Block -->
  <rect x="0" y="0" width="24" height="630" fill="#F5C518"/>

  <!-- Outer Card Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="#FFFFFF" stroke="#060E1C" stroke-width="6"/>

  <!-- Drop Shadow Decorative Block -->
  <rect x="72" y="62" width="1080" height="530" rx="28" fill="none" stroke="#060E1C" stroke-width="6" opacity="0.12"/>

  <!-- Brand Badge Top Left -->
  <g transform="translate(110, 100)">
    <rect x="0" y="0" width="230" height="48" rx="14" fill="#F5C518" stroke="#060E1C" stroke-width="4"/>
    <text x="24" y="31" font-family="'Syne', 'Inter', sans-serif" font-weight="900" font-size="18" fill="#060E1C" letter-spacing="1">
      ★ EDVOURA HUB
    </text>
  </g>

  <!-- Grade Bands Pill Badges -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="130" height="48" rx="14" fill="#E0F2FE" stroke="#060E1C" stroke-width="3"/>
    <text x="18" y="30" font-family="sans-serif" font-weight="800" font-size="14" fill="#0369A1">EXPLORER</text>

    <rect x="145" y="0" width="120" height="48" rx="14" fill="#DCFCE7" stroke="#060E1C" stroke-width="3"/>
    <text x="22" y="30" font-family="sans-serif" font-weight="800" font-size="14" fill="#15803D">BUILDER</text>

    <rect x="280" y="0" width="130" height="48" rx="14" fill="#F3E8FF" stroke="#060E1C" stroke-width="3"/>
    <text x="20" y="30" font-family="sans-serif" font-weight="800" font-size="14" fill="#7E22CE">ACHIEVER</text>
  </g>

  <!-- Big Catchy Headline -->
  <text x="110" y="225" font-family="'Syne', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#060E1C" letter-spacing="-1">
    Where Curious Minds Master
  </text>
  <text x="110" y="285" font-family="'Syne', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#060E1C" letter-spacing="-1">
    Math, Science & Literacy.
  </text>

  <!-- Subheadline -->
  <text x="110" y="345" font-family="sans-serif" font-weight="600" font-size="22" fill="#475569">
    1-on-1 Certified Tutors • 300,000+ Past Questions • Open Storybook Library
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(110, 400)">
    <!-- WAEC & JAMB -->
    <rect x="0" y="0" width="190" height="46" rx="12" fill="#FEF08A" stroke="#060E1C" stroke-width="3"/>
    <text x="18" y="29" font-family="sans-serif" font-weight="800" font-size="15" fill="#060E1C">🇳🇬 WAEC & JAMB</text>

    <!-- UK GCSE -->
    <rect x="205" y="0" width="170" height="46" rx="12" fill="#E0E7FF" stroke="#060E1C" stroke-width="3"/>
    <text x="18" y="29" font-family="sans-serif" font-weight="800" font-size="15" fill="#060E1C">🇬🇧 Key Stage & GCSE</text>

    <!-- US Common Core -->
    <rect x="390" y="0" width="190" height="46" rx="12" fill="#FCE7F3" stroke="#060E1C" stroke-width="3"/>
    <text x="18" y="29" font-family="sans-serif" font-weight="800" font-size="15" fill="#060E1C">🇺🇸 US Common Core</text>

    <!-- India CBSE -->
    <rect x="595" y="0" width="170" height="46" rx="12" fill="#FED7AA" stroke="#060E1C" stroke-width="3"/>
    <text x="18" y="29" font-family="sans-serif" font-weight="800" font-size="15" fill="#060E1C">🇮🇳 CBSE & ICSE</text>
  </g>

  <!-- Footer Branding Bar -->
  <line x1="110" y1="480" x2="1030" y2="480" stroke="#E2E8F0" stroke-width="3"/>
  <text x="110" y="525" font-family="sans-serif" font-weight="900" font-size="20" fill="#060E1C">
    edvouralearninghub.com
  </text>
  <text x="790" y="525" font-family="sans-serif" font-weight="700" font-size="18" fill="#64748B">
    Grades 1–12 • EYFS Nursery to High School
  </text>
</svg>
